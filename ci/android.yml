# IVE — Android CI. Copy to .github/workflows/android.yml.
# Builds a debug APK on every push/PR so regressions are caught without a phone.

name: android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Lint
        working-directory: android
        run: ./gradlew lintDebug --no-daemon
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: ive-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
