name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: syntax + demo build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install --no-audit --no-fund
      - name: node --check every source file
        run: |
          fail=0
          for f in $(find src scripts -name '*.js' -not -path '*/node_modules/*'); do
            node --check "$f" || fail=1
          done
          exit $fail
      - name: unit tests
        run: npm test
      - name: build offline demo
        run: node scripts/build-demo.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ive-demo
          path: demo/index.html

  macos:
    name: package (macOS)
    needs: check
    runs-on: macos-14
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: npm install --no-audit --no-fund
      - run: npm run icons
      - run: npm run build:fn
      - name: Build, sign (if secrets exist) and package
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            npx electron-builder --mac --publish always
          else
            npx electron-builder --mac --publish never
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: IVE-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: warn
