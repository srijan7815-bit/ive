# IVE — release pipeline
#
# Copy this file to .github/workflows/release.yml (see ci/README.md for why it
# lives here). Push a tag like v1.0.0 and you get:
#
#   IVE-1.0.0-mac-arm64.dmg   IVE-1.0.0-mac-x64.dmg    (+ zips)
#   IVE-1.0.0-win-x64.exe     IVE-1.0.0-win-arm64.exe  (+ zip)
#   IVE-1.0.0-android.apk     IVE-1.0.0-android.aab
#
# Everything lands on one draft GitHub Release; the last job publishes it.
#
# Required secrets (Settings → Secrets → Actions):
#   GH_TOKEN is provided by Actions automatically.
#   macOS signing   : CSC_LINK (base64 .p12), CSC_KEY_PASSWORD
#   macOS notarizing: APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows signing : WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD  (optional)
#   Android signing : ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
#                     ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      draft:
        description: "Keep the GitHub release as a draft"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: "20"

jobs:
  # ------------------------------------------------------------------ macOS
  macos:
    name: macOS (dmg + zip, arm64 + x64)
    runs-on: macos-14
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build the Fn gesture helper (universal binary)
        run: npm run build:fn

      - name: Verify the helper
        run: |
          file native/fn-listener/.build/fn-listener
          lipo -archs native/fn-listener/.build/fn-listener

      - name: Unit tests
        run: npm test

      - name: Package + publish to the draft release
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # No certificate configured → skip discovery instead of failing.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml

  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows (NSIS + zip, x64 + arm64)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Package + publish to the draft release
        shell: pwsh
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.zip
            release/latest.yml

  # ---------------------------------------------------------------- Android
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Restore the upload keystore
        if: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build
        working-directory: android
        run: |
          ./gradlew bundleRelease assembleRelease --no-daemon
          mkdir -p ../release
          cp app/build/outputs/apk/release/*.apk ../release/IVE-${GITHUB_REF_NAME#v}-android.apk
          cp app/build/outputs/bundle/release/*.aab ../release/IVE-${GITHUB_REF_NAME#v}-android.aab

      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          if-no-files-found: error
          path: release/*android.*

  # ------------------------------------------------------- assemble + publish
  publish:
    name: Publish release
    needs: [macos, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach Android builds + checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --draft --title "IVE ${GITHUB_REF_NAME}" --generate-notes
          find artifacts -type f \( -name '*.apk' -o -name '*.aab' \) -print0 | xargs -0 gh release upload "${GITHUB_REF_NAME}" --clobber
          cd artifacts && find . -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.apk' -o -name '*.aab' \) -exec shasum -a 256 {} \; > SHA256SUMS.txt
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS.txt --clobber

      - name: Undraft
        if: ${{ !inputs.draft }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
