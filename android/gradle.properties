# IVE builds on small machines too: ~560 MB heap keeps the whole
# compile + D8 + package cycle inside a 1 GB container.
org.gradle.jvmargs=-Xmx560m -XX:MaxMetaspaceSize=320m -XX:ReservedCodeCacheSize=64m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.workers.max=1
org.gradle.vfs.watch=false
org.gradle.caching=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx480m
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
